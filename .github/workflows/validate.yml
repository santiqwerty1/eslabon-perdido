name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validación completa (§19.2)
        run: python scripts/validate/validate.py all
      - name: Integridad del snapshot (§16.6)
        run: python scripts/snapshot/snapshot.py verify
